<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickNotes Draft Pad</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <div class="header-content">
        <div>
          <p class="eyebrow">QuickNotes</p>
          <h1>Draft Pad</h1>
        </div>
        <button id="theme-toggle" class="secondary-btn" type="button">
          Dark mode
        </button>
      </div>
    </header>

    <main>
      <section class="editor-card" aria-labelledby="editor-title">
        <div class="card-heading">
          <div>
            <p class="eyebrow">Your ideas, saved as you type</p>
            <h2 id="editor-title">Write a note</h2>
          </div>
          <span class="saved-indicator" aria-label="Draft saves automatically">
            Auto-save on
          </span>
        </div>

        <label for="note-text">Your note</label>
        <textarea
          id="note-text"
          name="note-text"
          rows="12"
          placeholder="Start typing here..."
          spellcheck="true"
        ></textarea>

        <div class="editor-footer">
          <div class="counts" aria-live="polite" aria-atomic="true">
            <p id="char-count">0 / 200 characters</p>
            <p id="word-count">0 words</p>
          </div>
          <button id="clear-btn" class="clear-btn" type="button">
            Clear note
          </button>
        </div>
        <p class="keyboard-hint">Tip: press Escape in the note to clear it.</p>
      </section>
    </main>

    <footer>
      <p>Your draft stays in this browser.</p>
    </footer>
  </body>
</html>
